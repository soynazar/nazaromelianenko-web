<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Пролог – ваша оценка</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F4F1ED;color:#2B2723;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
    main{max-width:520px;margin:0 auto;padding:4.5rem 1.6rem 4rem}
    .logo{display:block;width:54px;margin:0 auto 3.2rem;opacity:.9}
    .kicker{font-size:.68rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#BF653F;margin:0 0 1.1rem}
    h1{font-family:'Cormorant Garamond',Garamond,serif;font-weight:600;font-size:2.7rem;line-height:1.02;margin:0 0 .9rem;letter-spacing:-.01em}
    h1 em{font-style:italic;font-weight:500;color:#BF653F}
    .rule{width:72px;border-top:1px solid #BF653F;margin:0 0 1.8rem}
    p{font-size:.95rem;line-height:1.65;margin:0 0 1.1rem;color:#3A3430}
    .stars{display:flex;gap:.55rem;margin:.4rem 0 .5rem}
    .stars button{all:unset;cursor:pointer;line-height:0;padding:.15rem;border-radius:2px;-webkit-tap-highlight-color:transparent}
    .stars button:focus-visible{outline:1px solid #BF653F;outline-offset:3px}
    .stars svg{width:38px;height:38px;display:block}
    .stars path{fill:transparent;stroke:#BF653F;stroke-width:1.1;transition:fill .2s}
    .stars button.on path{fill:#BF653F}
    .saved{font-size:.78rem;letter-spacing:.04em;color:#8C8278;min-height:1.2rem;margin:0 0 2.2rem}
    .more{border-top:1px solid rgba(43,39,35,.14);padding-top:1.8rem;display:none}
    label.f{display:block;font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6A6159;margin:0 0 .5rem}
    .opt{font-weight:400;letter-spacing:.04em;text-transform:none;color:#8C8278}
    textarea,input[type=text]{width:100%;font:inherit;font-size:1rem;padding:.9rem 1rem;border:1px solid #2B2723;border-radius:2px;background:#FBF9F6;color:#2B2723;outline:none;margin:0 0 1.3rem}
    textarea{min-height:8.5rem;resize:vertical;line-height:1.55;font-family:'Cormorant Garamond',Garamond,serif;font-size:1.15rem}
    textarea:focus,input[type=text]:focus{border-color:#BF653F}
    .consent{display:flex;gap:.7rem;align-items:flex-start;font-size:.78rem;line-height:1.5;color:#6A6159;margin:0 0 1.4rem}
    .consent input{margin-top:.2rem;accent-color:#BF653F}
    .send{width:100%;font:inherit;font-size:.74rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:1.05rem;border:1px solid #2B2723;background:#2B2723;color:#F4F1ED;border-radius:2px;cursor:pointer;transition:background .25s,color .25s}
    .send:hover{background:transparent;color:#2B2723}
    .send[disabled]{opacity:.5;cursor:default}
    .err{font-size:.8rem;color:#A04030;min-height:1.2rem;margin:.7rem 0 0}
    .done{display:none;border-top:1px solid #BF653F;padding-top:1.4rem}
    .done p:first-child{font-family:'Cormorant Garamond',serif;font-size:1.5rem;line-height:1.2;color:#2B2723}
    footer{text-align:center;font-size:.72rem;color:#8C8278;margin-top:4rem;letter-spacing:.04em}
    footer a{color:inherit;text-decoration:none}
  </style>
</head>
<body>
<main>
  <a href="/ru/index.html"><img class="logo" src="/images/logo.png" alt="Nazar Omelianenko"></a>

  <h1 id="h">Как вам <em>пролог?</em></h1>
  <div class="rule"></div>
  <p id="lead">Оцените его в один клик.</p>

  <div class="stars" id="s" role="radiogroup" aria-label="Оценка от одной до пяти звёзд"></div>
  <p class="saved" id="sv"></p>

  <div class="more" id="m">
    <form id="f" novalidate>
      <label class="f" for="t">Несколько слов <span class="opt">– по желанию</span></label>
      <textarea id="t" maxlength="3000" placeholder="Что отозвалось, что удивило, какой вопрос остался…"></textarea>
      <label class="f" for="n">Подпись <span class="opt">– по желанию</span></label>
      <input id="n" type="text" maxlength="120" autocomplete="name" placeholder="Имя или инициалы">
      <label class="consent"><input id="p" type="checkbox"><span>Отзыв можно опубликовать с этой подписью.</span></label>
      <button class="send" id="b" type="submit">Отправить отзыв</button>
      <p class="err" id="e"></p>
    </form>
  </div>
  <div class="done" id="d">
    <p>Спасибо. Ваш отзыв у меня.</p>
    <p>Каждое слово я читаю сам.</p>
  </div>

  <footer>© Nazar Omelianenko · <a href="https://www.nazaromelianenko.com">nazaromelianenko.com</a></footer>
</main>
<script>
(function(){
  var API='https://chwbvfyyorfjyttbwtad.supabase.co/rest/v1/rpc/valorar_libro';
  var KEY='sb_publishable_pG-IU-4E8rppZlhSt5I7bA_soRU3wOq';
  var STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.75 5.86 6.35.74-4.7 4.37 1.24 6.29L12 16.9l-5.64 3.16 1.24-6.29-4.7-4.37 6.35-.74z"/></svg>';
  var s=document.getElementById('s'),sv=document.getElementById('sv'),m=document.getElementById('m');
  var sesion=null,nota=0;
  try{sesion=localStorage.getItem('otzyv_sesion');}catch(_){}
  if(!sesion){
    sesion=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c=='x'?r:(r&3|8)).toString(16);});
    try{localStorage.setItem('otzyv_sesion',sesion);}catch(_){}
  }
  function send(extra){
    var body={p_sesion:sesion,p_estrellas:nota,p_fuente:'prologo'};
    for(var k in extra){body[k]=extra[k];}
    return fetch(API,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){if(!r.ok)throw new Error(r.status);});
  }
  function paint(){
    var bs=s.querySelectorAll('button');
    for(var i=0;i<bs.length;i++){bs[i].className=(i<nota)?'on':'';bs[i].setAttribute('aria-checked',i+1===nota?'true':'false');}
  }
  function rate(v){
    nota=v;paint();sv.textContent='Сохраняю…';
    send({}).then(function(){
      sv.textContent='Оценка сохранена. Спасибо.';
      document.getElementById('h').innerHTML='Спасибо<br><em>за оценку</em>';
      document.getElementById('lead').textContent='Если есть желание, поделитесь впечатлениями.';
      m.style.display='block';
    }).catch(function(){sv.textContent='Не удалось сохранить. Попробуйте ещё раз.';});
  }
  for(var i=1;i<=5;i++){
    var b=document.createElement('button');b.type='button';b.innerHTML=STAR;
    b.setAttribute('role','radio');b.setAttribute('aria-label',i+' из 5');
    (function(v){b.addEventListener('click',function(){rate(v);});})(i);
    s.appendChild(b);
  }
  var r=parseInt(new URLSearchParams(location.search).get('r'),10);
  if(r>=1&&r<=5){rate(r);}
  document.getElementById('f').addEventListener('submit',function(ev){
    ev.preventDefault();
    var t=document.getElementById('t').value.trim(),e=document.getElementById('e'),bt=document.getElementById('b');
    if(!t){e.textContent='Напишите хотя бы пару слов\u00a0– или просто закройте страницу: оценка уже сохранена.';return;}
    e.textContent='';bt.disabled=true;
    send({p_texto:t,p_nombre:document.getElementById('n').value.trim()||null,p_publicar:document.getElementById('p').checked})
      .then(function(){m.style.display='none';sv.style.display='none';document.getElementById('lead').style.display='none';document.getElementById('d').style.display='block';})
      .catch(function(){bt.disabled=false;e.textContent='Не удалось отправить. Попробуйте ещё раз.';});
  });
})();
</script>
</body>
</html>
