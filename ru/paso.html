<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3EDE3">
<title>По ту сторону</title>
<meta property="og:title" content="По ту сторону">
<meta property="og:description" content=" ">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg">
<link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap">
</head>
<body>
<style>
/* Página-umbral: una escena de una sola pantalla. La línea es el umbral; al cruzarla, la escena se desplaza en capas (parallax) y queda la composición de la plantilla D. */
:root{
  --bg:#F3EDE3; --bg-hi:#F7F2E9; --bg-lo:#EDE4D6;
  --ink:#2B2723; --soft:#5A5149; --mute:#8C8278;
  --terra:#BF653F; --rule:#C9805F;
  --serif:"Cormorant Garamond","EB Garamond",Garamond,"Times New Roman",serif;
  --g:max(24px, env(safe-area-inset-left,0px), calc((100vw - 34rem) / 2));
  --y:46svh;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.stage{position:relative;height:100vh;height:100svh;overflow:hidden}
.bg{position:absolute;top:-10%;bottom:-10%;left:-15%;width:150%;pointer-events:none;
  background:radial-gradient(60% 55% at 62% 28%,var(--bg-hi) 0%,var(--bg) 52%,var(--bg-lo) 100%);will-change:transform}

/* Esta orilla: la pregunta */
.ask{position:absolute;left:var(--g);right:var(--g);top:calc(env(safe-area-inset-top,0px) + 15svh);margin:0;
  font-weight:500;font-size:clamp(2.2rem,9.4vw,3.1rem);line-height:1.1;will-change:transform,opacity}
.ask em{font-style:italic;color:var(--terra)}
.ch{opacity:0;transition:opacity .55s ease}
.ch.on{opacity:1}
.cw{position:relative;display:inline-block;width:0;height:0}
.caret{position:absolute;left:.04em;bottom:-.12em;width:.05em;height:.82em;background:var(--ink)}
.caret.off{opacity:0}
.gone .caret{display:none}

/* El umbral */
.track{position:absolute;left:var(--g);right:0;top:var(--y);height:56px;margin-top:-28px;touch-action:none;cursor:grab;outline:none}
.base{position:absolute;left:0;right:0;top:50%;height:1.2px;margin-top:-.6px;background:var(--rule);opacity:.6;transform-origin:left center;transform:scaleX(0);transition:transform 1.6s cubic-bezier(.25,.7,.15,1)}
.drawn .base{transform:scaleX(1)}
.fill{position:absolute;left:0;top:50%;height:2.4px;margin-top:-1.2px;width:0;background:var(--rule);opacity:0;transition:opacity .9s ease}
.drawn .fill{opacity:1}
.dot{position:absolute;left:-20px;top:50%;width:56px;height:56px;margin-top:-28px;padding:0;border:0;background:transparent;cursor:grab;touch-action:none;outline:none;opacity:0;transition:opacity .9s ease}
.drawn .dot{opacity:1}
.dot i{position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:var(--terra);transition:transform .9s cubic-bezier(.3,.7,.3,1),box-shadow .9s ease}
.dot.breath i{transform:scale(1.22);box-shadow:0 0 0 8px rgba(191,101,63,.09)}
.dot.melt i{transition:transform .5s cubic-bezier(.5,0,.3,1),box-shadow .3s;transform:scale(1.4,.16);box-shadow:none}
.dot:focus-visible i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--terra)}

/* La otra orilla: el título, que llega desde la derecha */
.label{position:absolute;left:0;bottom:calc(100% - var(--y) + 12px);margin:0;white-space:nowrap;
  font-size:clamp(1.7rem,7.2vw,2.3rem);line-height:1;transform-origin:left bottom;opacity:0;transition:opacity 1s ease;will-change:transform}
.label em{font-style:italic;color:var(--terra)}
.drawn .label{opacity:1}

/* Bajo la línea, al final */
.after{position:absolute;left:var(--g);right:var(--g);top:calc(var(--y) + 30px);display:flex;flex-direction:column;gap:10px}
.after > *{margin:0;opacity:0;transform:translateY(8px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.crossed .after > *{opacity:1;transform:none}
.crossed .after > :nth-child(2){transition-delay:.35s}
.crossed .after > :nth-child(3){transition-delay:.7s}
.author{font-size:.98rem;letter-spacing:.05em;color:var(--soft)}
.isbn{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;font-size:1.12rem;color:var(--ink);font-variant-numeric:lining-nums tabular-nums;letter-spacing:.02em}
.copy{font:inherit;font-style:italic;font-size:1.05rem;color:var(--terra);background:none;border:0;padding:6px 0;cursor:pointer;border-bottom:1px solid rgba(191,101,63,.45);line-height:1.1;letter-spacing:0}
.copy:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
.when{font-size:1.12rem;letter-spacing:.08em;color:var(--ink);font-variant-numeric:lining-nums}
.when a{color:var(--terra);font-style:italic;letter-spacing:0;text-decoration:none;border-bottom:1px solid rgba(191,101,63,.45)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .ch,.base,.dot,.label,.after > *{transition:none}
}
</style>

<main class="stage" id="stage">
  <div class="bg" id="bg"></div>

  <h1 class="ask" id="ask"><span class="sr" id="askSr"></span><span aria-hidden="true" id="askText"></span></h1>

  <p class="label" id="label">По ту сторону <em>правил</em></p>

  <div class="track" id="track">
    <div class="base"></div>
    <div class="fill" id="fill"></div>
    <button class="dot" id="dot" type="button" aria-label="Перейти по ту сторону правил"><i></i></button>
  </div>

  <section class="after" aria-live="polite">
    <p class="author">Назар Омельяненко</p>
    <p class="isbn"><span id="isbn">ISBN 978-84-09-90248-4</span><button class="copy" id="copy" type="button">скопировать</button></p>
    <p class="when" id="when">17.11</p>
  </section>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var stage=$('stage'),bg=$('bg'),ask=$('ask'),label=$('label'),track=$('track'),fill=$('fill'),dot=$('dot');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rnd=function(a,b){return a+Math.random()*(b-a)};
  var lerp=function(a,b,t){return a+(b-a)*t};

  /* Visitas */
  var visits=0;
  try{visits=parseInt(localStorage.getItem('paso.v')||'0',10)||0;localStorage.setItem('paso.v',String(visits+1));}catch(e){}
  var Q=visits>0
    ? [['Перейти ещё раз'],[null],['по ту сторону'],[null],['правил',1],['?']]
    : [['Устали от'],[null],['правил',1],['?']];

  /* Después del 17 nov (00:00 Madrid) la puerta se abre */
  if(Date.now()>=Date.UTC(2026,10,16,23,0,0)){$('when').innerHTML='<a href="/book.html">Открыть книгу</a>';}

  /* La pregunta: letra a letra, sin prisa, con ritmo humano */
  $('askSr').textContent=Q.map(function(t){return t[0]===null?' ':t[0]}).join('');
  var out=$('askText'),chars=[];
  Q.forEach(function(t){
    if(t[0]===null){if(chars.length)chars[chars.length-1].dataset.br='1';out.appendChild(document.createElement('br'));return;}
    var host=t[1]?out.appendChild(document.createElement('em')):out;
    t[0].split('').forEach(function(c){var s=document.createElement('span');s.className='ch';s.textContent=c;host.appendChild(s);chars.push(s);});
  });
  var cw=document.createElement('span');cw.className='cw';cw.innerHTML='<span class="caret" id="caret"></span>';
  var caret;
  function placeCaret(after){after.parentNode.insertBefore(cw,after.nextSibling);}
  function typeAll(done){
    if(reduce){chars.forEach(function(s){s.classList.add('on');});placeCaret(chars[chars.length-1]);caret=$('caret');done();return;}
    chars[0].parentNode.insertBefore(cw,chars[0]);caret=$('caret');
    var i=0;
    (function step(){
      if(i>=chars.length){done();return;}
      var s=chars[i],c=s.textContent;s.classList.add('on');placeCaret(s);i++;
      var d=rnd(90,190);
      if(c===' ')d+=rnd(40,140);
      if(c==='.'||c==='?')d+=rnd(380,700);
      if(Math.random()<.08)d+=rnd(220,520);
      if(s.dataset.br)d+=rnd(260,520);
      setTimeout(step,d);
    })();
  }
  var caretT;
  function blink(){if(!caret)return;caret.classList.toggle('off');caretT=setTimeout(blink,rnd(380,880)+(Math.random()<.14?rnd(500,1300):0));}

  /* Geometría */
  var W,G,TW,LW,max,S0=.62;
  var p=0,crossed=false,dragging=false,sx=0,sp=0,raf=0;
  function measure(){
    W=window.innerWidth;G=track.getBoundingClientRect().left;TW=track.clientWidth;
    label.style.transform='none';LW=label.getBoundingClientRect().width;
    max=Math.max(140,TW-64);
    render();
  }
  function render(){
    var lx=lerp(W-G-LW*S0,G,p), ls=lerp(S0,1,p);
    label.style.transform='translateX('+lx+'px) scale('+ls+')';
    var c=[Math.round(lerp(90,43,p)),Math.round(lerp(81,39,p)),Math.round(lerp(73,35,p))];
    label.style.color='rgb('+c.join(',')+')';
    ask.style.transform='translateX('+(-p*W*1.15)+'px)';
    ask.style.opacity=String(Math.max(0,1-p*1.5));
    bg.style.transform='translateX('+(-p*W*.18)+'px)';
    var x=p*max;
    dot.style.transform='translateX('+x+'px)';
    fill.style.width=(x+7)+'px';
  }
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  function animateTo(target,ms,then){
    cancelAnimationFrame(raf);
    var from=p,t0=performance.now();
    (function f(now){
      var t=Math.min(1,(now-t0)/ms);p=lerp(from,target,ease(t));render();
      if(t<1)raf=requestAnimationFrame(f);else if(then)then();
    })(t0);
  }

  /* El punto respira, sin ritmo fijo: alguien está ahí */
  var breathT;
  function breathe(){if(crossed||dragging)return;dot.classList.toggle('breath');breathT=setTimeout(breathe,rnd(1300,3400));}

  function cross(){
    if(crossed)return;crossed=true;
    clearTimeout(breathT);clearTimeout(caretT);stage.classList.add('gone');
    dot.classList.remove('breath');dot.setAttribute('tabindex','-1');
    animateTo(1,reduce?1:650,function(){
      dot.classList.add('melt');
      fill.style.transition='width .9s cubic-bezier(.3,.7,.3,1)';
      fill.style.width=TW+'px';
      dot.style.transition='opacity .5s ease .25s';dot.style.opacity='0';
      try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}
      setTimeout(function(){stage.classList.add('crossed');},reduce?0:450);
    });
  }
  function down(e){
    if(crossed||!stage.classList.contains('drawn'))return;
    dragging=true;cancelAnimationFrame(raf);clearTimeout(breathT);dot.classList.remove('breath');
    sx=e.clientX;sp=p;try{track.setPointerCapture(e.pointerId);}catch(_){}
  }
  function move(e){if(!dragging)return;p=Math.max(0,Math.min(1,sp+(e.clientX-sx)/max));render();}
  function up(){
    if(!dragging)return;dragging=false;
    if(p>=.6)cross();else animateTo(0,500,function(){breathT=setTimeout(breathe,rnd(800,1600));});
  }
  track.addEventListener('pointerdown',down);
  track.addEventListener('pointermove',move);
  track.addEventListener('pointerup',up);
  track.addEventListener('pointercancel',up);
  dot.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='Enter'||e.key===' '){e.preventDefault();cross();}});
  window.addEventListener('resize',function(){measure();if(crossed)fill.style.width=TW+'px';});

  /* Copiar el número */
  $('copy').addEventListener('click',function(){
    var btn=this,ok=false;
    function show(){btn.textContent=ok?'скопировано':'номер выделен';}
    function fallback(){var r=document.createRange();r.selectNodeContents($('isbn'));var s=getSelection();s.removeAllRanges();s.addRange(r);try{ok=document.execCommand('copy');}catch(e){}show();}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText('9788409902484').then(function(){ok=true;show();},fallback);}else fallback();
  });

  /* Secuencia de entrada */
  measure();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
  setTimeout(function(){
    typeAll(function(){
      blink();
      setTimeout(function(){
        stage.classList.add('drawn');
        breathT=setTimeout(breathe,reduce?0:2200);
      },reduce?0:rnd(700,1000));
    });
  },reduce?0:rnd(800,1200));
})();
</script>

</body>
</html>
