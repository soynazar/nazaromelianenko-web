<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F3EDE3">
<title>По ту сторону</title>
<meta property="og:title" content="По ту сторону">
<meta property="og:description" content=" ">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg">
<link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap">
</head>
<body>
<style>
/* Página-umbral: una escena de una sola pantalla. La línea es el umbral; al cruzarla, la escena se desplaza en capas (parallax) y queda la composición de la plantilla D. */
:root{
  --bg:#F3EDE3; --bg-hi:#F7F2E9; --bg-lo:#EDE4D6;
  --ink:#2B2723; --soft:#5A5149; --mute:#8C8278;
  --terra:#BF653F; --rule:#C9805F;
  --serif:"Cormorant Garamond","EB Garamond",Garamond,"Times New Roman",serif;
  --g:max(24px, env(safe-area-inset-left,0px), calc((100vw - 34rem) / 2));
  --y:46svh;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.stage{position:relative;height:100vh;height:100svh;overflow:hidden}
.stage.landed{touch-action:none;cursor:grab}
.stage.landed:active{cursor:grabbing}
.bg{position:absolute;top:-10%;bottom:-10%;left:-15%;width:150%;pointer-events:none;
  background:radial-gradient(60% 55% at 62% 28%,var(--bg-hi) 0%,var(--bg) 52%,var(--bg-lo) 100%);will-change:transform}

/* Esta orilla: la pregunta */
.ask{position:absolute;left:var(--g);right:var(--g);top:calc(env(safe-area-inset-top,0px) + 15svh);margin:0;
  font-weight:500;font-size:clamp(2.2rem,9.4vw,3.1rem);line-height:1.1;will-change:transform,opacity}
.ask em{font-style:italic;color:var(--terra)}
.ask{opacity:0;translate:0 8px;transition:opacity 2.4s ease,translate 2.4s cubic-bezier(.2,.7,.2,1)}
.shown .ask{opacity:1;translate:0 0}
.cw{position:relative;display:inline-block;width:0;height:0}

/* El umbral */
.track{position:absolute;left:var(--g);right:0;top:var(--y);height:56px;margin-top:-28px;touch-action:none;cursor:grab;outline:none}
.base{position:absolute;left:0;right:0;top:50%;height:1.2px;margin-top:-.6px;border-radius:1px;background:var(--rule);opacity:.6;transform-origin:right center;transform:scaleX(0)}
.landed .base{transform:scaleX(1)}
.comet{position:absolute;left:0;top:50%;width:110px;height:2.4px;margin-top:-1.2px;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(191,101,63,1) 0%,rgba(201,128,95,.55) 30%,rgba(201,128,95,0) 100%)}
.comet::before{content:"";position:absolute;left:-3.5px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--terra);box-shadow:0 0 10px 3px rgba(191,101,63,.35)}
.fill{position:absolute;left:0;top:50%;height:1.2px;margin-top:-.6px;border-radius:2px;width:0;background:var(--rule);opacity:0;transition:opacity .9s ease}
.fill.full{height:2.4px;margin-top:-1.2px}
.landed .fill{opacity:1}
.dot{position:absolute;left:-20px;top:50%;width:56px;height:56px;margin-top:-28px;padding:0;border:0;background:transparent;cursor:grab;touch-action:none;outline:none;opacity:0}
.landed .dot{opacity:1}
.dot.nudge{animation:nudge 1.2s cubic-bezier(.3,.6,.3,1)}
@keyframes nudge{0%,100%{translate:0 0}40%{translate:14px 0}}
.dot i{position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:var(--terra);transition:transform .9s cubic-bezier(.3,.7,.3,1),box-shadow .9s ease}
.dot.breath i{transform:scale(1.22);box-shadow:0 0 0 8px rgba(191,101,63,.09)}
.dot.melt i{transition:transform .2s cubic-bezier(.5,0,.3,1),box-shadow .15s;transform:scale(1.5,.16);box-shadow:none}
.dot:focus-visible i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--terra)}

/* La otra orilla: el título, que llega desde la derecha */
.label{position:absolute;left:0;bottom:calc(100% - var(--y) + 12px);margin:0;white-space:nowrap;
  font-size:clamp(1.7rem,7.2vw,2.3rem);line-height:1;transform-origin:left bottom;opacity:0;transition:opacity 1s ease;will-change:transform}
.label em{font-style:italic;color:var(--terra)}
.lit .label{opacity:1}

/* Bajo la línea, al final */
.after{position:absolute;left:var(--g);right:var(--g);top:calc(var(--y) + 30px);display:flex;flex-direction:column;gap:10px}
.after > *{margin:0;opacity:0;transform:translateY(8px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.crossed .after > *{opacity:1;transform:none}
.crossed .after > :nth-child(1){transition-delay:.25s}
.author{font-size:.98rem;letter-spacing:.05em;color:var(--soft)}
.isbn{font-size:1.12rem;line-height:1.4;color:var(--ink);font-variant-numeric:lining-nums tabular-nums;letter-spacing:.02em}
.copy{display:inline;font:inherit;font-style:italic;line-height:inherit;letter-spacing:0;color:var(--terra);background:none;border:0;padding:0;margin:0 0 0 14px;cursor:pointer;vertical-align:baseline;
  text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:rgba(191,101,63,.5);text-underline-offset:5px;-webkit-appearance:none;appearance:none}
.copy.alive{animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.42}}
.copy:focus-visible{outline:2px solid var(--terra);outline-offset:3px}
/* Tercera orilla: solo el número. Llega por la línea, como sobre un raíl */
.num{position:absolute;left:var(--g);bottom:calc(100% - var(--y) + 12px);margin:0;white-space:nowrap;
  font-size:clamp(1.23rem,5.2vw,1.66rem);line-height:1;font-weight:400;color:var(--ink);font-variant-numeric:lining-nums;letter-spacing:0;will-change:transform,opacity}
.num .pre{font-size:.55em;letter-spacing:.16em;color:var(--mute);margin-right:.7em;vertical-align:baseline}
.after3{position:absolute;left:var(--g);right:var(--g);top:calc(var(--y) + 30px);display:flex;flex-direction:column;gap:10px;will-change:transform,opacity}
.after3 > *{margin:0}
.copyrow{font-size:1.12rem;line-height:1.4}
.copyrow .copy{margin:0}
.s3{visibility:hidden;opacity:0;translate:0 8px;transition:opacity 1.1s ease,translate 1.1s cubic-bezier(.2,.7,.2,1)}
.crossed .s3{visibility:visible}
.on3 .s3{opacity:1;translate:0 0}
.on3 .after3{transition-delay:.35s}
/* La continuación de la línea hacia la tercera orilla: discontinua, tras un pequeño hueco */
.dash{position:absolute;top:50%;height:1.2px;margin-top:-.6px;opacity:0;transition:opacity .6s ease;
  background:repeating-linear-gradient(90deg,var(--rule) 0 7px,transparent 7px 13px)}
.crossed .dash{opacity:.85}
.when{font-size:1.12rem;letter-spacing:.08em;color:var(--ink);font-variant-numeric:lining-nums}
.when a{color:var(--terra);font-style:italic;letter-spacing:0;text-decoration:none;border-bottom:1px solid rgba(191,101,63,.45)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .ask,.label,.after > *,.s3{transition:none}
  .copy.alive,.dot.nudge{animation:none}
}
</style>

<main class="stage" id="stage">
  <div class="bg" id="bg"></div>

  <h1 class="ask" id="ask"><span class="sr" id="askSr"></span><span aria-hidden="true" id="askText"></span></h1>

  <p class="label" id="label">По ту сторону <em>правил</em></p>

  <div class="track" id="track">
    <div class="base" id="base"></div>
    <div class="comet" id="comet"></div>
    <div class="fill" id="fill"></div>
    <div class="dash" id="dash"></div>
    <button class="dot" id="dot" type="button" aria-label="Перейти по ту сторону правил"><i></i></button>
  </div>

  <section class="after" id="after" aria-live="polite">
    <p class="when" id="when">17.11.2026</p>
  </section>

  <p class="num s3" id="num" inert><span class="pre">ISBN</span><span id="isbn">978-84-09-90248-4</span></p>
  <section class="after3 s3" id="after3" inert>
    <p class="copyrow"><button class="copy" id="copy" type="button">скопировать</button></p>
  </section>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var stage=$('stage'),bg=$('bg'),ask=$('ask'),label=$('label'),track=$('track'),fill=$('fill'),dot=$('dot');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rnd=function(a,b){return a+Math.random()*(b-a)};
  var lerp=function(a,b,t){return a+(b-a)*t};

  /* Segunda visita: desactivada mientras se pule la primera. Para verla: añadir #vuelta a la dirección. */
  var RETURN_ENABLED=false, visits=0;
  if(RETURN_ENABLED){try{visits=parseInt(localStorage.getItem('paso.v')||'0',10)||0;localStorage.setItem('paso.v',String(visits+1));}catch(e){}}
  var back=location.hash==='#vuelta'||(RETURN_ENABLED&&visits>0);
  var Q=back
    ? [['Перейти ещё раз'],[null],['по ту сторону'],[null],['правил',1],['?']]
    : [['Перейти'],[null],['по ту сторону'],[null],['правил',1],['?']];

  /* Después del 17 nov (00:00 Madrid) la puerta se abre */
  if(Date.now()>=Date.UTC(2026,10,16,23,0,0)){$('when').innerHTML='<a href="/book.html">Открыть книгу</a>';}

  /* La frase completa, sin escritura letra a letra */
  $('askSr').textContent=Q.map(function(t){return t[0]===null?' ':t[0]}).join('');
  var out=$('askText');
  Q.forEach(function(t){
    if(t[0]===null){out.appendChild(document.createElement('br'));return;}
    if(t[1]){var em=document.createElement('em');em.textContent=t[0];out.appendChild(em);}else{out.appendChild(document.createTextNode(t[0]));}
  });

  /* Geometría */
  var after=$('after'),num=$('num'),after3=$('after3'),dash=$('dash');
  var W,G,TW,LW,max,S0=.62;
  /* p: de la pregunta al libro (0→1). q: del libro al número (0→1), solo tras cruzar */
  var p=0,q=0,crossed=false,dragging=false,sx=0,sp=0,sq=0,raf=0,captured=false,lastX=0,lastT=0,vx=0;
  function measure(){
    W=window.innerWidth;G=track.getBoundingClientRect().left;TW=track.clientWidth;
    label.style.transform='none';LW=label.getBoundingClientRect().width;
    max=Math.max(140,TW-64);
    dash.style.left=W+'px';dash.style.width=W+'px';
    render();
  }
  function render(){
    var lx=lerp(W-G-LW*S0,G,p)-q*W, ls=lerp(S0,1,p);
    label.style.transform='translateX('+lx+'px) scale('+ls+')';
    /* Paralaje a lo largo de la línea: la línea y lo de arriba a la velocidad del dedo, lo de abajo algo más rápido, el fondo más lento */
    var o2=String(Math.max(0,1-Math.abs(q)*.85));
    label.style.opacity=crossed?o2:'';
    after.style.transform='translateX('+(-q*W*1.2)+'px)';after.style.opacity=o2;
    num.style.transform='translateX('+((1-q)*W)+'px)';
    after3.style.transform='translateX('+((1-q)*W*1.2)+'px)';
    var lt=(-q*W)+'px 0';base.style.translate=lt;fill.style.translate=lt;dash.style.translate=lt;
    var c=[Math.round(lerp(90,43,p)),Math.round(lerp(81,39,p)),Math.round(lerp(73,35,p))];
    label.style.color='rgb('+c.join(',')+')';
    ask.style.transform='translateX('+(-p*W*1.15)+'px)';
    ask.style.opacity=String(Math.max(0,1-p*1.5));
    bg.style.transform='translateX('+(-p*W*.18-q*W*.12)+'px)';
    var x=p*max;
    dot.style.transform='translateX('+x+'px)';
    if(!fill.classList.contains('full'))fill.style.width=(x>0.5?x+8:0)+'px';
  }
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  function easeOut(t){return 1-Math.pow(1-t,2);}
  function animateTo(target,ms,then,fn){
    fn=fn||ease;
    cancelAnimationFrame(raf);
    var from=p,t0=performance.now();
    (function f(now){
      var t=Math.min(1,(now-t0)/ms);p=lerp(from,target,fn(t));render();
      if(t<1)raf=requestAnimationFrame(f);else if(then)then();
    })(t0);
  }
  function easeOut3(t){return 1-Math.pow(1-t,3);}
  function animateQ(target,ms,then){
    cancelAnimationFrame(raf);
    var from=q,t0=performance.now();
    (function f(now){
      var t=Math.min(1,(now-t0)/ms);q=lerp(from,target,easeOut3(t));render();
      if(t<1)raf=requestAnimationFrame(f);else{if(then)then();}
    })(t0);
  }

  /* Al otro lado: el libro y el número. Se puede ir y volver por la línea; el cruce no se deshace */
  var seen3=false,cueT,on3=false;
  function settleQ(target){
    animateQ(target,reduce?1:480,function(){
      q=target;render();
      var now3=target===1;
      if(now3!==on3){on3=now3;
        stage.classList.toggle('on3',on3);
        if(on3){num.removeAttribute('inert');after3.removeAttribute('inert');after.setAttribute('inert','');}
        else{num.setAttribute('inert','');after3.setAttribute('inert','');after.removeAttribute('inert');}
      }
      if(on3&&!seen3){seen3=true;clearTimeout(cueT);copyT=setTimeout(function(){if(!copied&&!reduce)copyBtn.classList.add('alive');},2400);}
    });
  }
  /* Aviso de que el camino sigue: la composición entera se inclina un poco a lo largo de la línea y vuelve, la misma gramática que el punto */
  function cue(first){
    cueT=setTimeout(function(){
      if(seen3)return;
      if(!dragging&&q===0){
        var amp=12/W,t0=performance.now();cancelAnimationFrame(raf);
        (function f(now){var t=Math.min(1,(now-t0)/1200);q=amp*Math.pow(Math.sin(Math.PI*t),2);render();if(t<1)raf=requestAnimationFrame(f);else{q=0;render();}})(t0);
      }
      cue(false);
    },first?2600:rnd(4800,8400));
  }

  /* El punto respira, sin ritmo fijo: alguien está ahí */
  var breathT,nudgeT;
  function breathe(){if(crossed||dragging)return;dot.classList.toggle('breath');breathT=setTimeout(breathe,rnd(1300,3400));}
  function nudge(first){nudgeT=setTimeout(function(){if(crossed)return;if(!dragging){dot.classList.remove('nudge');void dot.offsetWidth;dot.classList.add('nudge');}nudge(false);},first?1300:rnd(3600,7200));}

  function cross(){
    if(crossed)return;crossed=true;
    clearTimeout(breathT);clearTimeout(nudgeT);
    dot.classList.remove('breath');dot.setAttribute('tabindex','-1');
    animateTo(1,reduce?1:260,function(){
      dot.classList.add('melt');
      fill.style.transition='width .35s cubic-bezier(.3,.7,.3,1),height .35s ease,margin-top .35s ease';
      fill.classList.add('full');
      fill.style.width=TW+'px';
      dot.style.transition='opacity .18s ease .12s';dot.style.opacity='0';
      try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}
      setTimeout(function(){stage.classList.add('crossed');if(!reduce)cue(true);},reduce?0:220);
    },easeOut);
  }
  var after2=function(){return stage.classList.contains('crossed');};
  function down(e){
    if(!stage.classList.contains('landed'))return;
    if(crossed&&!after2())return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    dragging=true;captured=false;cancelAnimationFrame(raf);
    if(!crossed){clearTimeout(breathT);dot.classList.remove('breath','nudge');}
    else if(q>0&&q<.05){q=0;render();}
    sx=lastX=e.clientX;lastT=performance.now();vx=0;sp=p;sq=q;
    stage._pid=e.pointerId;
  }
  function move(e){
    if(!dragging)return;
    var dx=e.clientX-sx;
    /* La captura se toma solo cuando el gesto ya es un deslizamiento: así los toques en «скопировать» y en el enlace siguen funcionando */
    if(!captured&&Math.abs(dx)>6){captured=true;try{stage.setPointerCapture(e.pointerId);}catch(_){}}
    var now=performance.now(),dt=now-lastT;if(dt>0){vx=lerp(vx,(e.clientX-lastX)/dt,.5);lastX=e.clientX;lastT=now;}
    if(!crossed){p=Math.max(0,Math.min(1,sp+dx/max));}
    else{
      var raw=sq-dx/(W*.7);
      /* Resistencia elástica en los extremos: hacia atrás no se vuelve a la pregunta; hacia delante, el camino termina */
      q=raw<0?Math.max(-.08,raw*.25):raw>1?Math.min(1.08,1+(raw-1)*.25):raw;
    }
    render();
  }
  function up(){
    if(!dragging)return;dragging=false;
    if(!crossed){
      if(p>=.6)cross();else animateTo(0,500,function(){breathT=setTimeout(breathe,rnd(800,1600));});
      return;
    }
    if(!captured){if(q!==0&&q!==1)settleQ(q>.5?1:0);return;}
    var target;
    if(vx<-.35)target=1;else if(vx>.35)target=0;
    else target=sq<.5?(q>.3?1:0):(q<.7?0:1);
    settleQ(target);
  }
  stage.addEventListener('pointerdown',down);
  stage.addEventListener('pointermove',move);
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);
  dot.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='Enter'||e.key===' '){e.preventDefault();cross();}});
  document.addEventListener('keydown',function(e){
    if(!crossed||!after2())return;
    if(e.key==='ArrowRight'&&q!==1){e.preventDefault();settleQ(1);}
    else if(e.key==='ArrowLeft'&&q!==0){e.preventDefault();settleQ(0);}
  });
  window.addEventListener('resize',function(){measure();if(crossed)fill.style.width=TW+'px';});

  /* Señal de vida tras el colofón: «скопировать» respira, sin ritmo fijo, hasta que se copia */
  var copyBtn=$('copy'),copyT,copied=false;
  function stillCopy(){var o=getComputedStyle(copyBtn).opacity;copyBtn.style.opacity=o;copyBtn.classList.remove('alive');void copyBtn.offsetWidth;copyBtn.style.transition='opacity .8s ease';copyBtn.style.opacity='1';}

  /* Copiar el número */
  $('copy').addEventListener('click',function(){
    var btn=this,ok=false;
    function show(){btn.textContent=ok?'скопировано':'номер выделен';copied=true;clearTimeout(copyT);stillCopy();}
    function fallback(){var r=document.createRange();r.selectNodeContents($('isbn'));var s=getSelection();s.removeAllRanges();s.addRange(r);try{ok=document.execCommand('copy');}catch(e){}show();}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText('9788409902484').then(function(){ok=true;show();},fallback);}else fallback();
  });

  /* Secuencia de entrada: la frase; poco después llega desde la derecha un rayo que deja la línea como rastro y se condensa en el punto */
  var base=$('base'),comet=$('comet'),dotI=dot.querySelector('i');
  function land(){
    stage.classList.add('landed');base.style.transform='scaleX(1)';base.getAnimations&&base.getAnimations().forEach(function(a){a.cancel();});base.style.clipPath='inset(0 0 0 8px round 1px)';
    breathT=setTimeout(breathe,reduce?0:2600);
    if(!reduce)nudge(true);
  }
  function arrive(){
    measure();stage.classList.add('lit');
    if(reduce||!comet.animate){land();return;}
    var dur=900,ez='cubic-bezier(.3,.55,.35,1)',from=TW+40;
    base.style.transform='scaleX(1)';
    base.animate([{clipPath:'inset(0 0 0 '+from+'px round 1px)'},{clipPath:'inset(0 0 0 8px round 1px)'}],{duration:dur,easing:ez,fill:'forwards'});
    var a=comet.animate([{transform:'translateX('+from+'px)',opacity:0},{opacity:1,offset:.06},{transform:'translateX(8px)',opacity:1}],{duration:dur,easing:ez,fill:'forwards'});
    a.onfinish=function(){
      land();
      comet.animate([{opacity:1},{opacity:0}],{duration:240,fill:'forwards'});
      dotI.animate([{transform:'scale(.25)',opacity:.5},{transform:'scale(1.4)',opacity:1,offset:.5},{transform:'scale(1)',opacity:1}],{duration:380,easing:'ease-out'});
    };
  }
  measure();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
  setTimeout(function(){
    stage.classList.add('shown');
    setTimeout(arrive,reduce?0:1100);
  },reduce?0:400);
})();
</script>

</body>
</html>
